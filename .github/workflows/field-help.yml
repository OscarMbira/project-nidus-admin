name: Admin Field Help Check

# Admin rule 23 (monorepo v1345 slices 5–6): every Admin field label has contextual help, or is marked
# data-help="exempt" (rule-23 exclusions). Fails on any key used without a seeded admin.field_help row.
# --enforce: fails on a raw label without help too (coverage reached 100% on 2026-11-22).

on:
  push:
    branches: [master, main]
    paths:
      - 'shell/**'
      - 'modules/**'
      - 'packages/**'
      - 'SQL/**'
      - 'scripts/check-field-help.mjs'
  pull_request:
    paths:
      - 'shell/**'
      - 'modules/**'
      - 'packages/**'
      - 'SQL/**'
      - 'scripts/check-field-help.mjs'

jobs:
  field-help:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Every Admin field has help (or is marked exempt)
        run: node scripts/check-field-help.mjs --enforce
